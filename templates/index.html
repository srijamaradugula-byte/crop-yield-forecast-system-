<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CropCast AI – Per-Acre Yield Forecasting</title>
<style>
:root{--bg:#f3f6f1;--card:#fff;--tx:#1d2b1f;--mu:#667466;--g:#2d6a35;--gl:#e6f0e4;--bd:#d5dfd3;--rd:#a33}
@media(prefers-color-scheme:dark){:root{--bg:#121a13;--card:#1b261c;--tx:#e6efe5;--mu:#9bad9b;--g:#5cb06a;--gl:#243526;--bd:#2f4231}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
header{background:var(--g);color:#fff;padding:14px 18px}header b{font-size:20px}header span{opacity:.85;font-size:13px;margin-left:8px}
main{max-width:980px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:14px}
h2{margin:0 0 10px;color:var(--g);font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
label{font-size:12px;color:var(--mu);display:block}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:8px;background:var(--g);color:#fff;font:600 16px system-ui;cursor:pointer}
.big{font-size:52px;font-weight:700;color:var(--g);line-height:1}
.tag{display:inline-block;background:#f6e7b4;color:#5a4300;border-radius:99px;padding:2px 10px;font-size:12px}
.rng{position:relative;height:14px;background:var(--gl);border-radius:7px;margin:14px 0 4px}
.rng i{position:absolute;top:0;height:100%;background:var(--g);opacity:.45;border-radius:7px}
.rng u{position:absolute;top:-3px;width:4px;height:20px;background:var(--g)}
table{width:100%;border-collapse:collapse}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left}th{background:var(--gl)}
.err{color:var(--rd);font-weight:600;margin-top:10px}.mu{color:var(--mu);font-size:13px}
</style></head><body>
<header><b>CropCast AI</b><span>Per-Acre Yield Forecasting System · Ramachandra College of Engineering</span></header>
<main>
<div class="card"><h2>Enter Field and Crop Details</h2>
<div class="grid" id="form"></div>
<button class="btn" id="go">Forecast Yield</button><div class="err" id="err"></div></div>
<div id="out"></div>
<p class="mu">Engine: {{ engine }}</p>
</main>
<script>
const $=id=>document.getElementById(id);
const F={{ fields|tojson }};
$("form").innerHTML=F.map(f=>`<div><label>${f.l}</label>`+(f.t=="s"
 ?`<select id="${f.k}">${f.o.map(o=>`<option>${o}</option>`).join("")}</select>`
 :`<input id="${f.k}" type="number" step="any" value="${f.v}">`)+`</div>`).join("");
async function run(){
  $("err").textContent="";
  const body={};F.forEach(f=>body[f.k]=$(f.k).value);
  const r=await fetch("/api/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  if(!r.ok){$("err").textContent=d.error;return}
  const top=Math.max(d.high*1.05,0.0001);
  const pc=x=>Math.min(100,Math.max(0,x/top*100));
  $("out").innerHTML=`<div class="card"><h2>Forecast Result</h2><span class="tag">Model used: ${d.stage}-day stage</span>
  <p class="mu" style="margin:10px 0 2px">Predicted yield per acre</p>
  <div class="big">${d.yield.toFixed(1)} <small style="font-size:18px">quintals / acre</small></div>
  <div class="rng"><i style="left:${pc(d.low)}%;width:${pc(d.high)-pc(d.low)}%"></i><u style="left:${pc(d.yield)}%"></u></div>
  <div>Expected range (90% interval): <b>${d.low.toFixed(1)} – ${d.high.toFixed(1)}</b> q/acre</div></div>
  <div class="card"><table><tr><th>Total expected production</th><th>Indicative revenue (reference ₹${d.price.toLocaleString("en-IN")}/q)</th></tr>
  <tr><td>${d.total.toFixed(1)} quintals</td><td>₹ ${d.revenue.toLocaleString("en-IN")}</td></tr></table>
  <p class="mu">Typical error at this stage: R² ${d.r2}, MAPE ${d.mape}%. Prices are illustrative.</p></div>`;
}
$("go").onclick=run;run();
</script></body></html>
